<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #202124;
            color: #e8eaed;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            text-decoration: underline;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px 15px 29px;
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .apps {
            width: 32px;
            height: 32px;
            display: grid;
            grid-template-columns: repeat(3, 4px);
            grid-template-rows: repeat(3, 4px);
            gap: 3px;
            align-content: center;
            justify-content: center;
            border-radius: 50%;
        }

        .apps span {
            width: 4px;
            height: 4px;
            background-color: #bdc1c6;
            border-radius: 50%;
        }

        .apps:hover {
            background-color: #303134;
        }

        .profile {
            width: 28px;
            height: 28px;
            background-color: #0097a7;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 190px 20px 40px;
        }

        .logo {
            margin-bottom: 29px;
        }

        .logo img {
            display: block;
            width: 230px;
            height: auto;
        }

        .search-box {
            width: 590px;
            max-width: 100%;
            height: 46px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 10px 0 15px;
            background-color: #303134;
            border: 1px solid #5f6368;
            border-radius: 30px;
        }

        .search-box:hover,
        .search-box:focus-within {
            border-color: transparent;
            box-shadow: 0 1px 6px #171717;
        }

        .plus {
            color: #e8eaed;
            font-size: 25px;
            cursor: pointer;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 14px;
        }


        .search-icon {
            flex-shrink: 0;
            border: none;
            padding: 2px;
            background: transparent;
            cursor: pointer;
        }

        .search-icon:hover {
            opacity: 0.75;
        }

        .search-icon:focus-visible {
            outline: 2px solid #8ab4f8;
            outline-offset: 3px;
            border-radius: 4px;
        }

        .search-icon img {
            display: block;
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .ai-mode {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 9px 11px;
            border: none;
            border-radius: 20px;
            background-color: #45474f;
            color: #e8eaed;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
        }

        .ai-mode img {
            display: block;
            width: 16px;
            height: 16px;
        }

        .ai-mode:hover {
            background-color: #5f6368;
            text-decoration: none;
        }

        .shortcuts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
            margin-top: 26px;
        }

        .shortcut {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 14px;
            background-color: #303134;
            border: 1px solid transparent;
            border-radius: 25px;
            font-size: 14px;
        }

        .shortcut:hover {
            border-color: #5f6368;
            text-decoration: none;
        }

        .shortcut-icon img {
            display: block;
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .shortcut-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .pin-icon {
            transform: rotate(45deg);
        }

        .languages {
            margin-top: 38px;
            font-size: 13px;
            text-align: center;
            line-height: 2;
        }

        .languages a {
            color: #8ab4f8;
            margin: 0 1px;
        }

        .footer {
            margin-top: auto;
            font-size: 14px;
        }

        .country {
            padding: 15px 32px;
            border-bottom: 1px solid #3c4043;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 15px 32px;
        }

        .footer-group {
            display: flex;
            flex-wrap: wrap;
            gap: 27px;
        }

    </style>
</head>

<body>

    <header class="navbar">

        <nav class="nav-left" aria-label="Main navigation">
            <a href="https://about.google/">About</a>
            <a href="https://store.google.com/">Store</a>
        </nav>

        <nav class="nav-right" aria-label="Google services">
            <a href="https://mail.google.com/">Gmail</a>
            <a href="#">Images</a>

            <a href="#" class="apps" aria-label="Google Apps" title="Google Apps">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </a>

            <a href="https://myaccount.google.com/" class="profile" aria-label="Google Account">C</a>
        </nav>

    </header>

    <main class="main">

        <h1 class="logo"><img src="./google.svg" alt="Google"></h1>

        
        <form class="search-box" action="https://www.google.com/search" method="get" aria-label="Google Search">
            <span class="plus">+</span>

            <input type="search" name="q" aria-label="Search Google" autocomplete="off">

            <button class="search-icon" type="button" aria-label="Voice search" title="Voice search">
                <img src="./mic.svg" alt="">
            </button>

            <button class="search-icon" type="button" aria-label="Search by image" title="Search by image">
                <img src="./search-lens.svg" alt="">
            </button>

            <a href="https://www.google.com/" class="ai-mode" aria-label="Open Google">
                <img src="./search-icon.svg" alt="">
                AI Mode
            </a>
        </form>


        <nav class="shortcuts" aria-label="Quick actions">

            <a href="https://www.google.com/ai" class="shortcut">
                <span class="shortcut-icon">🍌</span>
                Create images
            </a>

            <a href="https://www.google.com/ai" class="shortcut">
                <span class="shortcut-icon"><img class="pin-icon" src="./pin.svg" alt=""></span>
                Ask about files
            </a>

            <a href="https://www.google.com/ai" class="shortcut">
                <span class="shortcut-icon"><img src="./bulb.svg" alt=""></span>
                Brainstorm
            </a>

            <a href="https://www.google.com/doodles" class="shortcut">
                I'm Feeling Lucky
            </a>

        </nav>

        <div class="languages">
            Google offered in:
            <a href="https://www.google.com/?hl=hi">हिन्दी</a>
            <a href="https://www.google.com/?hl=bn">বাংলা</a>
            <a href="https://www.google.com/?hl=te">తెలుగు</a>
            <a href="https://www.google.com/?hl=mr">मराठी</a>
            <a href="https://www.google.com/?hl=ta">தமிழ்</a>
            <a href="https://www.google.com/?hl=gu">ગુજરાતી</a>
            <a href="https://www.google.com/?hl=kn">ಕನ್ನಡ</a>
            <a href="https://www.google.com/?hl=ml">മലയാളം</a>
            <a href="https://www.google.com/?hl=pa">ਪੰਜਾਬੀ</a>
        </div>

    </main>

    <footer class="footer">

        <div class="country">India</div>

        <div class="footer-links">

            <nav class="footer-group" aria-label="Business links">
                <a href="https://ads.google.com/">Advertising</a>
                <a href="https://www.google.com/intl/en_in/business/">
                    Business
                </a>
                <a href="https://www.google.com/search/howsearchworks/">
                    How Search works
                </a>
            </nav>

            <nav class="footer-group" aria-label="Legal and settings">
                <a href="https://policies.google.com/privacy">Privacy</a>
                <a href="https://policies.google.com/terms">Terms</a>
                <a href="https://www.google.com/preferences">Settings</a>
            </nav>

        </div>

    </footer>

</body>
</html>
